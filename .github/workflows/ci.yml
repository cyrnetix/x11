name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Lint every file
        # php -l prints a line per file and exits 0 even on failure when piped,
        # so failures are counted rather than trusted to the exit status.
        run: |
          fail=0
          for f in $(find src example tests -name '*.php'); do
            php -l "$f" > /dev/null || { echo "syntax error in $f"; fail=1; }
          done
          exit $fail

      - name: Tests
        # No X server on the runner: these suites are the ones that need none.
        run: composer test
